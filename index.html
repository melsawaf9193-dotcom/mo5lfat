<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 نظام مخالفات الهلال الأحمر</title>

<style>
body {
    margin: 0;
    font-family: 'Cairo', sans-serif;
    background-image: url('https://raw.githubusercontent.com/xhhp1/medicaljpg/main/medic.jpg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    max-width: 750px;
    width: 95%;
    margin: 40px auto;
    padding: 30px;
    background: rgba(255, 255, 255, 0.94);
    border-radius: 25px;
    backdrop-filter: blur(12px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
}

h2 {
    margin-bottom: 30px;
    color: #8B0000;
    text-align: center;
    font-weight: 900;
    border-bottom: 3px solid #8B0000;
    padding-bottom: 15px;
}

.form-group {
    margin-bottom: 18px;
    text-align: right;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 15px;
    color: #444;
    font-weight: 700;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 5px 0;
    border-radius: 12px;
    border: 2px solid #ddd;
    font-weight: 600;
    font-family: 'Cairo';
    box-sizing: border-box;
    outline: none;
}

input:focus, select:focus {
    border-color: #8B0000;
}

select[multiple] {
    height: 160px;
}

select[multiple] option:checked {
    background: linear-gradient(90deg, #8B0000, #b22222) !important;
    color: white;
}

.btn-group {
    display: flex; gap: 10px;
}

button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.btn-generate { background: linear-gradient(135deg, #8B0000 0%, #5a0000 100%); }
.btn-copy { background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%); }

.output {
    margin-top: 25px;
    padding: 20px;
    background: #fff;
    border-radius: 15px;
    border: 2px dashed #8B0000;
    white-space: pre-wrap;
    font-weight: 700;
    text-align: right;
}

.checkbox-container {
    background: #f8f8f8;
    padding: 12px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
    <h2>📋 نظام المخالفات</h2>

    <div class="form-group">
        <label>🆔 كود الشخص (ID):</label>
        <input id="id" placeholder="الصق الـ ID هنا...">
    </div>

    <div class="form-group" id="rescuerNameGroup" style="display:none;">
        <label>👨‍⚕️ اسم المسعف:</label>
        <input id="rescuerName" placeholder="الاسم + الكود...">
    </div>

    <div class="form-group">
        <label>🔍 بحث عن مخالفة:</label>
        <input id="search" onkeyup="filterList()" placeholder="ابحث...">
    </div>

    <div class="form-group">
        <label>🚫 قائمة المخالفات:</label>
        <select id="violation" multiple onchange="checkViolation(); handleFineMode()"></select>
    </div>

    <div class="form-group">
        <label class="checkbox-container">
            <input type="checkbox" id="customFineToggle" onchange="handleFineMode()"> تعديل الغرامة يدوياً
        </label>
    </div>

    <div class="form-group" id="customFineGroup" style="display:none;">
        <label>💰 غرامة يدوية:</label>
        <input id="customFine" type="number">
    </div>

    <div class="form-group">
        <label>📊 الإنذار:</label>
        <select id="level" onchange="handleExtraPunish()">
            <option value="شفهي">شفهي</option>
            <option value="اول">اول</option>
            <option value="ثاني">ثاني</option>
            <option value="نهائى بالفصل">نهائى بالفصل</option>
        </select>
    </div>

    <div class="form-group" id="banGroup" style="display:none;">
        <label>🚫 منع التوظيف:</label>
        <select id="banDuration">
            <option value="">بدون منع</option>
            <option value="منع من التوظيف 7 يوم">منع 7 أيام</option>
            <option value="منع من التوظيف 14 يوم">منع 14 يوماً</option>
        </select>
    </div>

    <div class="form-group" id="extraPunishGroup">
        <label>⚠️ عقوبة إضافية:</label>
        <select id="extraPunish">
            <option value="">بدون</option>
            <option value="كسر رتبة">كسر رتبة</option>
            <option value="تأخير ترقية">تأخير ترقية</option>
        </select>
    </div>

    <div class="form-group">
        <label>✍️ التوقيع:</label>
        <select id="signature">
            <option value="field">اشراف ميداني</option>
            <option value="general">اشراف عام</option>
            <option value="deputy">نائب مساعد القائد</option>
            <option value="cdeputy">مساعد القائد</option>
            <option value="bdeputy">نائب القائد</option>
            <option value="adeputy">قائد الهلال الاحمر</option>
        </select>
    </div>

    <div class="btn-group">
        <button class="btn-generate" onclick="generate()">إنشاء التقرير</button>
        <button class="btn-copy" onclick="copyText()">📋 نسخ</button>
    </div>

    <div id="out" class="output"></div>
</div>

<script>
const data = {
    "التواجد في روم العمليات اكثر من 3 دقائق": { fine:200000 },
    "عدم الحضور للأستدعاء": { fine:200000 },
    "اركاب مواطن في سيارة الاسعاف": { fine:200000 },
    "فتح تكت تظلم غير صحيح": { fine:200000 },
    "عدم تغيير الاسم في الفايف ام": { fine:200000 },
    "تسجيل خروج بدون ابلاغ طاقم العمليات": { fine:200000 },
    "اهمال مركبة": { fine:200000 },
    "قيادة غير واقعية": { fine:200000 },
    "الكتابة أثناء المنع او التنقيط": { fine:300000 },
    "عدم طلب كود 8": { fine:300000 },
    "عدم الالتزام بقوانين الهلال الأحمر": { fine:300000 },
    "اهمال الراديو": { fine:300000 },
    "الاعتراض على مخالفة صحيحة": { fine:300000 },
    "منشن الرقابة في رسائل الهلال الاحمر او التكتات": { fine:300000 },
    "عدم تسليم العمليات عند الخروج": { fine:300000 },
    "المباشرة بدون الدخول للموجة": { fine:300000 },
    "مباشرة في موقع غير موجه لك": { fine:300000 },
    "مباشرة بدون تسجيل دخول": { fine:300000 },
    "رفض توجيه العمليات": { fine:300000 },
    "ازعاج منسوبي الشؤون الإدارية": { fine:300000 },
    "اثارة الجدل في الشات العام": { fine:300000 },
    "عدم التزام ببروتوكولات الراديو": { fine:300000 },
    "عدم المباشرة بعد 5 دقائق من طلب كود 8": { fine:300000 },
    "عدم اعطاء الكود الميداني": { fine:300000 },
    "مخالفة قوانين التكت": { fine:300000 },
    "التأخير بالوصول للمسقطين": { fine:300000 },
    "دخول استنفار أمني بدون اذن": { fine:500000 },
    "المباشرة بدون اذن": { fine:500000 },
    "التدخل في شؤون القطاعات": { fine:500000 },
    "اسلوب غير لائق": { fine:500000 },
    "عدم طلب كود 3": { fine:500000 },
    "الخروج مشتركة": { fine:500000 },
    "الأفك او الغفوة اكثر من 15 دقيقة": { fine:500000 },
    "سجن رقابي بوظيفة الهلال الأحمر": { fine:500000 },
    "التأخر في العودة للوظيفة بعد انتهاء الاجازة الداخلية": { fine:500000 },
    "كثرة الشكاوي": { fine:500000 },
    "الرد بطريقة غير مناسبة": { fine:500000 },
    "التدخل في الشؤون الادارية": { fine:500000 },
    "التلاعب على مسؤولين الترقيات": { fine:500000 },
    "التلاعب في دفتر الحضور": { fine:500000 },
    "اهانة اي شخص بالمقاطعة": { fine:500000 },
    "المباشرة في موقع غير آمن": { fine:500000 },
    "التوجه لمعرض السيارات بدون اذن": { fine:500000 },
    "التوجه لكراج التعديل بدون اذن": { fine:500000 },
    "عدم الالتزام بقوانين الاجازة الداخلية": { fine:500000 },
    "دخول برنامج الدولة وقت الاجازة": { fine:500000 },
    "الدخول لموجة الرقابة": { fine:500000 },
    "تظليل مركبة حكومية": { fine:500000 },
    "الدخول لروم الكادر النسائي": { fine:500000 },
    "الاستهبال في روم العمليات": { fine:500000 },
    "مباشرة في مركبة غير مخصصة": { fine:500000 },
    "رفض استلام مهام العمليات": { fine:750000 },
    "المباشرة قبل العساكر": { fine:750000 },
    "حمل ممنوعات واسلحة": { fine:750000 },
    "المباشرة في المجرمين قبل العساكر": { fine:750000 },
    "الاستهبال بالميدان": { fine:750000 },
    "مضايقة الكادر النسائي": { fine:750000 },
    "حضور توظيف بدون اذن": { fine:750000 },
    "الانتداب بدون اذن": { fine:750000 },
    "تشويه سمعة الهلال الاحمر": { fine:750000 },
    "صدم مواطنين بشكل متعمد ومستمر": { fine:750000 },
    "مخالفة قوانين المقاطعة": { fine:1000000, action:"فصل" },
    "رتبة عليا في مدينة اخرى": { fine:1000000, action:"فصل" },
    "كثرة المخالفات": { fine:1000000, action:"فصل" },
    "اعتراض على قرار قيادة": { fine:1000000, action:"فصل" },
    "تهرب وظيفي": { fine:1000000, action:"فصل" },
    "عدم احترام القيادة": { fine:1000000, action:"فصل" },
    "الاجرام بوظيفة الهلال الأحمر": { fine:1000000, action:"فصل" },
    "سب وقذف": { fine:1000000, action:"فصل" },
    "تدبيل انعاش": { fine:1000000, action:"فصل" }
};

const signatures = {
    field: "<@&1071933366934458489>",
    general: "<@&1164572574391476264>",
    deputy: "<@&1153823182281777293>",
    adeputy: "<@&1071933359086911561>",
    bdeputy: "<@&1071933358503903242>",
    cdeputy: "<@&1092667422902862004>"
};

let select = document.getElementById("violation");
function loadList(list){
    select.innerHTML="";
    for(let key in list){
        let opt=document.createElement("option");
        opt.value=key; opt.textContent=key;
        select.appendChild(opt);
    }
}
loadList(data);

function filterList(){
    let q=document.getElementById("search").value.toLowerCase();
    let filtered={};
    for(let k in data){ if(k.toLowerCase().includes(q)) filtered[k]=data[k]; }
    loadList(filtered);
}

function checkViolation(){
    let selected = Array.from(select.selectedOptions).map(o => o.value);
    let hasDismiss = selected.some(v => data[v].action === "فصل");
    document.getElementById("rescuerNameGroup").style.display = hasDismiss ? "block" : "none";
    document.getElementById("banGroup").style.display = hasDismiss ? "block" : "none";
    document.getElementById("level").disabled = hasDismiss;
    if (!hasDismiss) document.getElementById("banDuration").value = "";
}

function handleExtraPunish(){
    let level = document.getElementById("level").value;
    document.getElementById("extraPunishGroup").style.display = (level === "شفهي") ? "none" : "block";
}

function handleFineMode(){
    let selected = Array.from(select.selectedOptions);
    let custom = document.getElementById("customFineToggle");
    let group = document.getElementById("customFineGroup");
    if(selected.length > 1){
        custom.checked = true; custom.disabled = true;
        group.style.display = "block";
    }else{
        custom.disabled = false;
        group.style.display = custom.checked ? "block" : "none";
    }
}

function generate(){
    let id=document.getElementById("id").value.trim();
    let name=document.getElementById("rescuerName").value.trim();
    let selected = Array.from(select.selectedOptions).map(o => o.value);
    if(!id || selected.length === 0) return alert("اكمل البيانات");

    let totalFine = 0;
    let hasDismiss = false;
    selected.forEach(vName=>{
        totalFine += data[vName].fine || 0;
        if(data[vName].action === "فصل") hasDismiss = true;
    });

    if(document.getElementById("customFineToggle").checked || selected.length > 1){
        totalFine = Number(document.getElementById("customFine").value) || 0;
    }

    let sign=signatures[document.getElementById("signature").value];
    let punish=""; let rescuerInfo=""; let extraNotes="";

    if(hasDismiss){
        let ban = document.getElementById("banDuration").value;
        let banText = ban ? ` + ${ban}` : "";
        punish=`فصل من القطاع + غرامة مالية بقيمة ( ${totalFine.toLocaleString()} )${banText}`;
        rescuerInfo = `<@${id}>\n${name}`;
    } else {
        let level = document.getElementById("level").value;
        let extraP = document.getElementById("extraPunish").value;
        if(level === "شفهي") punish = `انذار شفهي`;
        else {
            punish = `انذار ${level}${extraP ? ' + ' + extraP : ''} + غرامة مالية بقيمة ( ${totalFine.toLocaleString()} )`;
            extraNotes = `\n\n\`مهلة 24 ساعة لفتح تكت مساعدة من القيادة للسداد تجنباً لتدبيلها\``;
        }
        rescuerInfo = `<@${id}>`;
    }

    let result = `***قرار صادر من <@&1071933370407325807> ينص على :


${punish} للــمــســعــف :


${rescuerInfo}


\`وذلك بسبب (${selected.join(" + ")})\`${extraNotes}


توقيع :
${sign}


إعتماد :
<@&1071933358503903242>
<@725655707764129813>

<@&1071933359086911561> 
<@813079786855464961> ***`;

    document.getElementById("out").innerText=result;
}

function copyText(){
    let t=document.getElementById("out").innerText;
    navigator.clipboard.writeText(t);
    alert("تم النسخ ✅");
}
handleExtraPunish();
</script>
</body>
</html>
