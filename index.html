<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>📋 نظام المخالفات</title>

<style>
body{
  margin:0;
  font-family:Tahoma;
  background-image: url('https://raw.githubusercontent.com/xhhp1/medicaljpg/main/medic.jpg.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color:#000;
}

.container{
  max-width:700px;
  margin:40px auto;
  padding:25px;
  background:rgba(255,255,255,0.95);
  border-radius:20px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 20px rgba(0,0,0,0.3);
}

h2{
  margin-bottom:20px;
  color:#8B0000;
  text-align:center;
}

input, select{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ccc;
  background:#fff;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#8B0000;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.output{
  margin-top:20px;
  padding:15px;
  background:#ffffffcc;
  border-radius:10px;
  border:1px solid #ccc;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="container">
<h2>📋 نظام المخالفات</h2>

<input id="id" placeholder="كوبي ايدي الشخص">
<input id="rescuerName" placeholder="اسم المسعف + الكود الميداني" style="display:none;">
<input id="search" placeholder="🔍 ابحث عن المخالفة..." onkeyup="filterList()">

<select id="violation" multiple size="6" onchange="checkViolation(); handleFineMode()"></select>

<label>
<input type="checkbox" id="customFineToggle" onchange="handleFineMode()">
تعديل الغرامة يدوي
</label>

<input id="customFine" placeholder="اكتب قيمة الغرامة..." style="display:none;">

<select id="level" onchange="handleExtraPunish()">
  <option value="شفهي">شفهي</option>
  <option value="اول">اول</option>
  <option value="ثاني">ثاني</option>
  <option value="نهائى بالفصل">نهائى بالفصل </option>
</select>
<select id="extraPunish">
  <option value="">بدون</option>
  <option value="كسر رتبة">كسر رتبة</option>
  <option value="تأخير ترقية">تأخير ترقية</option>
</select>
<select id="signature">
  <option value="field">اشراف ميداني</option>
  <option value="general">اشراف عام</option>
  <option value="deputy">نائب مساعد القائد</option>
  <option value="cdeputy">مساعد القائد</option>
  <option value="bdeputy">نائب القائد</option>
  <option value="adeputy">قائد الهلال الاحمر</option>
</select>

<button onclick="generate()">إنشاء التقرير</button>
<button onclick="copyText()">📋 نسخ</button>

<div id="out" class="output"></div>
</div>

<script>

  "المباشرة بدون الدخول للموجة": { fine:300000 },

  "عدم المباشرة بعد 5 دقائق من طلب كود 8": { fine:300000 },
  "عدم اعطاء الكود الميداني": { fine:300000 },

  "التأخير بالوصول للمسقطين": { fine:300000 },

  // --- 500k ---
  "دخول استنفار أمني بدون اذن": { fine:500000 },
  "المباشرة بدون اذن": { fine:500000 },
  "التدخل في شؤون القطاعات": { fine:500000 },
  "اسلوب غير لائق": { fine:500000 }, 
  "عدم طلب كود 3": { fine:500000 }, 
  "الخروج مشتركة": { fine:500000 },
  "الأفك او الغفوة اكثر من 15 دقيقة": { fine:500000 },
  "سجن رقابي بوظيفة الهلال الأحمر": { fine:500000 },
  "التأخر في العودة للوظيفة بعد انتهاء الاجازة الداخلية": { fine:500000 },
  "كثرة الشكاوي": { fine:500000 },
  "الرد بطريقة غير مناسبة": { fine:500000 },
  "التدخل في الشؤون الادارية": { fine:500000 },
  "التلاعب على مسؤولين الترقيات": { fine:500000 },
  "التلاعب في دفتر الحضور": { fine:500000 },
  "اهانة اي شخص بالمقاطعة": { fine:500000 },
  "المباشرة في موقع غير آمن": { fine:500000 },
  "التوجه لمعرض السيارات بدون اذن": { fine:500000 },
  "التوجه لكراج التعديل بدون اذن": { fine:500000 },
  "عدم الالتزام بقوانين الاجازة الداخلية": { fine:500000 },
  "دخول برنامج الدولة وقت الاجازة": { fine:500000 },
  "الدخول لموجة الرقابة": { fine:500000 },
  "تظليل مركبة حكومية": { fine:500000 },
  "الدخول لروم الكادر النسائي": { fine:500000 },
  "الاستهبال في روم العمليات": { fine:500000 },
  "مباشرة في مركبة غير مخصصة": { fine:500000 },

  // --- 750k ---
  "رفض استلام مهام العمليات": { fine:750000 },
  "المباشرة قبل العساكر": { fine:750000 },
  "حمل ممنوعات واسلحة": { fine:750000 },
  "المباشرة في المجرمين قبل العساكر": { fine:750000 },
  "رفض استلام مهام طاقم العمليات": { fine:750000 },
  "الاستهبال بالميدان": { fine:750000 },
  "مضايقة الكادر النسائي": { fine:750000 },
  "حضور توظيف بدون اذن": { fine:750000 },
  "الانتداب بدون اذن": { fine:750000 },
  "تشويه سمعة الهلال الاحمر": { fine:750000 }, 
  "صدم مواطنين بشكل متعمد ومستمر": { fine:750000 }, 
  "مضايقة الكادر النسائي بأي شكل من الأشكال": { fine:750000 }, 
  "الاستهبال بالميدان": { fine:750000 }, 
  // --- فصل ---
  "مخالفة قوانين المقاطعة": { fine:1000000, action:"فصل" },
  "رتبة عليا في مدينة اخرى": { fine:1000000, action:"فصل" },
  "كثرة المخالفات": { fine:1000000, action:"فصل" },
  "اعتراض على قرار قيادة": { fine:1000000, action:"فصل" },
  "تهرب وظيفي": { fine:1000000, action:"فصل" },
  "استقالة قبل الرجوع من الاجازة": { fine:1000000, action:"فصل" },
  "عدم احترام القيادة": { fine:1000000, action:"فصل" },
  "استقالة فترة تدريب": { fine:1000000, action:"فصل" },
  "فصل نهائي عدم تواجد": { fine:1000000, action:"فصل" },
  "تلفيت من الدسكورد": { fine:1000000, action:"فصل" },
  "دخول غير شرعي": { fine:1000000, action:"فصل" },
  "عدم العودة بعد اجازة خارجية": { fine:1000000, action:"فصل" },
  "استخدام الرتبة للمصلحة الشخصية": { fine:1000000, action:"فصل" },
  "الاجرام بوظيفة الهلال الأحمر": { fine:1000000, action:"فصل" },
  "تخريب بوظيفة الهلال الأحمر": { fine:1000000, action:"فصل" },
  "تدبيل انعاش": { fine:1000000, action:"فصل" },
  "اللعن بأي شكل": { fine:1000000, action:"فصل" },
  "سب وقذف": { fine:1000000, action:"فصل" },
  "تخريب سيناريو": { fine:1000000, action:"فصل" },
  "صدم متعمد للانعاش": { fine:1000000, action:"فصل" }
};


const signatures = {
  field: "<@&1071933366934458489>",
  general: "<@&1164572574391476264>",
  deputy: "<@&1153823182281777293>",
  adeputy: "<@&1071933359086911561>",
  bdeputy: "<@&1071933358503903242>",
  cdeputy: "<@&1092667422902862004>"
};

let select = document.getElementById("violation");
let levelSelect = document.getElementById("level");

function loadList(list){
  select.innerHTML="";
  for(let key in list){
    let opt=document.createElement("option");
    opt.value=key;
    opt.textContent=key;
    select.appendChild(opt);
  }
}
loadList(data);

function filterList(){
  let q=document.getElementById("search").value.toLowerCase();
  let filtered={};

  for(let k in data){
    if(k.toLowerCase().includes(q)){
      filtered[k]=data[k];
    }
  }
  loadList(filtered);
}

function checkViolation(){
  let selected = Array.from(select.selectedOptions).map(o => o.value);
  let nameField = document.getElementById("rescuerName");

  let hasDismiss = selected.some(v => data[v].action === "فصل");

  if(hasDismiss){
    levelSelect.disabled = true;
    nameField.style.display = "block";
  }else{
    levelSelect.disabled = false;
    nameField.style.display = "none";
    nameField.value="";
  }
}
function handleExtraPunish(){
  let level = document.getElementById("level").value;
  let extra = document.getElementById("extraPunish");

if(level === "شفهي"){
  extra.value = "";
  extra.disabled = true;
  extra.style.display = "none";
}else{
  extra.disabled = false;
  extra.style.display = "block";
}
}
function handleFineMode(){
  let selected = Array.from(select.selectedOptions);
  let custom = document.getElementById("customFineToggle");
  let input = document.getElementById("customFine");

  if(selected.length > 1){
    custom.checked = true;
    custom.disabled = true;
    input.style.display = "block";
  }else{
    custom.disabled = false;
    input.style.display = custom.checked ? "block" : "none";
  }
}

function generate(){
  let id=document.getElementById("id").value.trim();
  let name=document.getElementById("rescuerName").value.trim();

  if(!/^\d+$/.test(id)){
    alert("اكتب ID صحيح");
    return;
  }

  let selected = Array.from(select.selectedOptions).map(o => o.value);

  if(selected.length === 0){
    alert("اختار مخالفة");
    return;
  }

  let violations = [];
  let totalFine = 0;
  let hasDismiss = false;

  selected.forEach(vName=>{
    violations.push(vName);
    totalFine += data[vName].fine || 0;

    if(data[vName].action === "فصل"){
      hasDismiss = true;
    }
  });

  let customOn = document.getElementById("customFineToggle").checked;

  if(selected.length > 1){
    let val = Number(document.getElementById("customFine").value);

    if(!val || val <= 0){
      alert("لازم تكتب الغرامة");
      return;
    }

    totalFine = val;
  }else{
    if(customOn){
      let val = Number(document.getElementById("customFine").value);

      if(!val || val <= 0){
        alert("اكتب قيمة الغرامة");
        return;
      }

      totalFine = val;
    }
  }

  let sign=signatures[document.getElementById("signature").value];

let punish="";
let extra="";
let rescuerInfo="";

if(hasDismiss){
  if(!name){
    alert("اكتب اسم المسعف");
    return;
  }

  punish=`فصل من القطاع + غرامة مالية بقيمة ( ${totalFine.toLocaleString()} )`;
  rescuerInfo = `<@${id}>\n${name}`;
}
else{

  let extraPunish = document.getElementById("extraPunish").value;
  let extraText = extraPunish ? ` + ${extraPunish}` : "";

  if(levelSelect.value === "شفهي"){
    punish = `انذار شفهي`;
  }else{
    punish = `انذار ${levelSelect.value}${extraText} + غرامة مالية بقيمة ( ${totalFine.toLocaleString()} )`;
  }

  rescuerInfo = `<@${id}>`;

if(levelSelect.value !== "شفهي" && totalFine > 0){
  extra = `\n\n\`مهلة 24 ساعة لفتح تكت مساعدة من القيادة للسداد تجنباً لتدبيلها\``;
}
}

  let result =
`***قرار صادر من <@&1071933370407325807> ينص على :


${punish} للــمــســعــف :


${rescuerInfo}


\`وذلك بسبب (${violations.join(" + ")})\`${extra}


توقيع :
${sign}

إعتماد :
<@&1071933358503903242>
<@725655707764129813>

<@&1071933359086911561> 
<@813079786855464961> ***`;

  document.getElementById("out").innerText=result;
}

function copyText(){
  let t=document.getElementById("out").innerText;
  if(!t) return alert("مفيش نص");
  navigator.clipboard.writeText(t);
  alert("تم النسخ ✅");
}
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
});

document.addEventListener('keydown', function(e) {
  if (
    (e.ctrlKey && e.key.toLowerCase() === 'u') ||
    (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') ||
    (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') ||
    (e.ctrlKey && e.key.toLowerCase() === 's')
  ) {
    e.preventDefault();
  }
});
handleExtraPunish();
</script>

</body>
</html>
