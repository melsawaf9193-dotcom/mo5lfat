<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>📋 نظام المخالفات</title>

<style>
body{
  margin:0;
  font-family:Tahoma;
  background-image: url('https://raw.githubusercontent.com/xhhp1/medicaljpg/main/medic.jpg.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color:#000;
}

.container{
  max-width:700px;
  margin:40px auto;
  padding:25px;
  background:rgba(255,255,255,0.95);
  border-radius:20px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 20px rgba(0,0,0,0.3);
}

h2{
  margin-bottom:20px;
  color:#8B0000;
  text-align:center;
}

input, select{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ccc;
  background:#fff;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#8B0000;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.output{
  margin-top:20px;
  padding:15px;
  background:#ffffffcc;
  border-radius:10px;
  border:1px solid #ccc;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="container">
<h2>📋 نظام المخالفات</h2>

<input id="id" placeholder="كوبي ايدي الشخص">

<input id="search" placeholder="🔍 ابحث عن المخالفة..." onkeyup="filterList()">

<select id="violation" onchange="checkViolation()"></select>

<select id="level">
  <option value="شفهي">شفهي</option>
  <option value="اول">اول</option>
  <option value="ثاني">ثاني</option>
  <option value="نهائي">نهائي</option>
</select>

<select id="signature">
  <option value="field">اشراف ميداني</option>
  <option value="general">اشراف عام</option>
  <option value="deputy">نائب مساعد القائد</option>
  <option value="cdeputy">مساعد القائد</option>
  <option value="bdeputy">نائب القائد</option>
  <option value="adeputy">قائد الهلال الاحمر</option>
</select>

<button onclick="generate()">إنشاء التقرير</button>
<button onclick="copyText()">📋 نسخ</button>

<div id="out" class="output"></div>
</div>

<script>

const data = {
  "قيادة متهورة": { fine:200000 },
  "اهمال مركبة": { fine:200000 },
  "عدم تسجيل خروج بدون ابلاغ": { fine:200000 },
  "عدم احترام المشرف": { fine:300000 },
  "عدم الاستجابة للراديو": { fine:300000 },
  "عدم الالتزام في قوانين الهلال الأحمر": { fine:300000 },

  "الدخول للكادر النسائي": { fine:500000 },
  "تضليل مركبة حكومية": { fine:500000 },

  "الدخول بدون اذن": { fine:750000 },
  "حمل اسلحة": { fine:750000 },

  // فصل
  "تخريب وظيفي": { fine:1000000, action:"فصل" },
  "عدم احترام القيادة": { fine:1000000, action:"فصل" },
  "كثرة المخالفات": { fine:1000000, action:"فصل" },

  "سب وقذف": { fine:1000000, action:"فصل" },
  "القتل بأي شكل من الأشكال": { fine:1000000, action:"فصل" },
  "تخريب وظيفة الهلال الأحمر": { fine:1000000, action:"فصل" },
  "الاجرام بوظيفة الهلال الأحمر": { fine:1000000, action:"فصل" },
  "دخول غير شرعي": { fine:1000000, action:"فصل" },
  "عدم العودة للوظيفة بعد اجازة خارجية": { fine:1000000, action:"فصل" }
};

const signatures = {
  field: "<@&1071933366934458489>",
  general: "<@&1164572574391476264>",
  deputy: "<@&1153823182281777293>",
  adeputy: "<@&1071933359086911561>",
  bdeputy: "<@&1071933358503903242>",
  cdeputy: "<@&1092667422902862004>"
};

let select = document.getElementById("violation");
let levelSelect = document.getElementById("level");

function loadList(list){
  select.innerHTML="";
  for(let key in list){
    let opt=document.createElement("option");
    opt.value=key;
    opt.textContent=key;
    select.appendChild(opt);
  }
}
loadList(data);

function filterList(){
  let q=document.getElementById("search").value.toLowerCase();
  let filtered={};

  for(let k in data){
    if(k.toLowerCase().includes(q)){
      filtered[k]=data[k];
    }
  }
  loadList(filtered);
}

// تعطيل مستوى الإنذار إذا كانت فصل
function checkViolation(){
  let v = select.value;
  if(data[v].action === "فصل"){
    levelSelect.disabled = true;
  }else{
    levelSelect.disabled = false;
  }
}

function generate(){
  let id=document.getElementById("id").value.trim();
  let v=select.value;
  let level=levelSelect.value;
  let sig=document.getElementById("signature").value;

  if(!/^\d+$/.test(id)){
    alert("اكتب ID صحيح");
    return;
  }

  let fine=data[v].fine;
  let action=data[v].action;
  let sign=signatures[sig];

  let punish="";
  let extra="";

  // 🔥 فصل إجباري
  if(action==="فصل"){
    punish=`فصل + غرامة مالية بقيمة ( ${fine.toLocaleString()} )`;
    extra="\n\nيتم تنفيذ الفصل بشكل فوري";
  }
  else{
    if(level==="شفهي"){
      punish="انذار شفهي";
    }else{
      punish=`انذار ${level} + غرامة مالية بقيمة ( ${fine.toLocaleString()} )`;
      extra="\n\nمهلة 24 ساعة للسداد لتجنب مضاعفة الغرامة";
    }
  }

  let result =
`***قرار صادر من <@&1071933370407325807> ينص على :

${punish} للــمــســعــف :

<@${id}>

وذلك بسبب ( ${v} )${extra}

توقيع :
${sign}

إعتماد :
<@&1071933358503903242>
<@725655707764129813>

<@&1071933359086911561> 
<@813079786855464961> ***`;

  document.getElementById("out").innerText=result;
}

function copyText(){
  let t=document.getElementById("out").innerText;
  if(!t) return alert("مفيش نص");
  navigator.clipboard.writeText(t);
  alert("تم النسخ ✅");
}
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
});

document.addEventListener('keydown', function(e) {
  if (
    (e.ctrlKey && e.key.toLowerCase() === 'u') ||
    (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') ||
    (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') ||
    (e.ctrlKey && e.key.toLowerCase() === 's')
  ) {
    e.preventDefault();
  }
});
</script>

</body>
</html>
